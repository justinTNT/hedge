name = "native-plants"
main = "worker-entry.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[dev]
port = 8794
local_protocol = "http"

[[d1_databases]]
binding = "DB"
database_name = "native-plants-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "native-plants-media"

[assets]
directory = "./_site"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/blobs/*"]
