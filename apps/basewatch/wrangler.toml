name = "basewatch"
main = "worker-entry.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Custom domains — basewatch.org cut over to Cloudflare 2026-09-11.
# custom_domain=true has Cloudflare create the proxied DNS record + TLS cert and
# bind the hostname to this worker. workers_dev stays on so the .workers.dev URL
# remains reachable alongside the custom domain during propagation.
workers_dev = true
routes = [
    { pattern = "basewatch.org", custom_domain = true },
    { pattern = "www.basewatch.org", custom_domain = true }
]

[dev]
port = 8787
local_protocol = "http"

# basewatch.org — a structured pages site. Public + hedge admin.
[[d1_databases]]
binding = "DB"
database_name = "basewatch-db"
database_id = "a1a76bc5-4678-4266-8cce-b13ae02de49a"

# Blob storage for admin image uploads in the rich-text editor (served back at /blobs/<key>).
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "basewatch-blobs"

# Static assets (the SPA + admin). No Durable Objects.
[assets]
directory = "./_site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

# ADMIN_KEY is deliberately absent from [vars]; set via `wrangler secret put`.
[vars]
ENVIRONMENT = "production"
