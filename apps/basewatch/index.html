<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__SITE_TITLE__</title>
    <style>
      :root {
        --red: #c1272d; --blue: #0a4d8c; --ink: #1c1f23; --muted: #5c6670;
        --line: #e3e6ea; --bg: #ffffff; --panel: #f6f8fa;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      a { color: var(--blue); }
      a:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 2px; }
      .skip { position: absolute; left: -999px; top: 0; background: var(--blue); color: #fff; padding: .6rem 1rem; z-index: 200; }
      .skip:focus { left: .5rem; top: .5rem; }
      .wrap { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem; }

      /* header */
      header.site { border-top: 4px solid var(--red); background: #fff; }
      .head-in { display: flex; align-items: center; gap: 1rem; padding: .9rem 0; }
      .brand { display: flex; align-items: center; gap: .9rem; text-decoration: none; color: inherit; }
      .brand img { height: 40px; width: auto; display: block; }
      .brand .tag { color: var(--muted); font-size: .82rem; line-height: 1.25; max-width: 22ch; }
      .menu-toggle { margin-left: auto; display: none; background: var(--panel);
        border: 1px solid var(--line); border-radius: 6px; padding: .5rem .8rem; font-size: .95rem; cursor: pointer; }

      /* ===== horizontal menu bar with hover/focus dropdowns ===== */
      .menubar { background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      nav.menu ul { list-style: none; margin: 0; padding: 0; }
      nav.menu > ul { display: flex; flex-wrap: wrap; }
      nav.menu li { position: relative; }
      nav.menu a { display: block; padding: .7rem .9rem; text-decoration: none; color: var(--ink); white-space: nowrap; }
      nav.menu > ul > li > a { font-weight: 600; }
      nav.menu a:hover { background: #fff; }
      nav.menu a[aria-current="page"] { color: var(--blue); box-shadow: inset 0 -3px 0 var(--blue); }
      nav.menu .caret { color: var(--muted); font-size: .7em; margin-left: .3em; }

      /* dropdown panels */
      nav.menu li > ul {
        position: absolute; top: 100%; left: 0; min-width: 220px;
        background: #fff; border: 1px solid var(--line); border-radius: 0 0 8px 8px;
        box-shadow: 0 10px 28px rgba(0,0,0,.14); padding: .3rem 0;
        opacity: 0; visibility: hidden; transform: translateY(-4px);
        transition: opacity .12s ease, transform .12s ease; z-index: 60;
      }
      nav.menu li:hover > ul, nav.menu li:focus-within > ul { opacity: 1; visibility: visible; transform: translateY(0); }
      nav.menu li > ul a { padding: .5rem 1.1rem; font-weight: 400; }
      nav.menu li > ul a:hover { background: var(--panel); }
      /* nested flyout to the right */
      nav.menu li li > ul { top: -.3rem; left: 100%; border-radius: 8px; }

      /* content — full width, comfortable reading measure */
      main { padding: 2rem 0 4rem; }
      .page { max-width: 800px; }
      main h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 1rem; border-bottom: 3px solid var(--red); padding-bottom: .5rem; }
      .body { font-size: 1.02rem; }
      .body p { margin: 0 0 1.05rem; }
      .body p:empty { display: none; }
      .body h2 { font-size: 1.4rem; margin: 2rem 0 .6rem; }
      .body h3 { font-size: 1.15rem; margin: 1.6rem 0 .5rem; }
      .body img { max-width: 100%; height: auto; border-radius: 4px; }
      .body ul, .body ol { margin: 0 0 1.05rem; padding-left: 1.4rem; }
      .body li { margin: .3rem 0; }
      .body blockquote { margin: 1.2rem 0; padding: .6rem 1.1rem; border-left: 4px solid var(--red); background: var(--panel); color: #33383d; }
      .body table { border-collapse: collapse; max-width: 100%; }
      .body td, .body th { border: 1px solid var(--line); padding: .4rem .6rem; }
      .loading { color: var(--muted); padding: 2rem 0; }

      footer.site { border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); }
      .foot-in { padding: 1.5rem 0; font-size: .9rem; }
      .foot-in a { color: var(--blue); }

      /* mobile: hamburger -> full vertical tree (hover doesn't work on touch) */
      @media (max-width: 820px) {
        .menu-toggle { display: inline-block; }
        nav.menu[hidden] { display: none; }
        nav.menu > ul { display: block; }
        nav.menu li > ul {
          position: static; opacity: 1; visibility: visible; transform: none;
          box-shadow: none; border: none; border-radius: 0;
          padding: 0 0 0 1rem; margin-left: .5rem; border-left: 2px solid var(--line);
        }
        nav.menu li li > ul { left: 0; }
        nav.menu .caret { display: none; }
      }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <header class="site">
    <div class="wrap head-in">
      <a class="brand" href="/">
        <img src="/images/layout/bwhead.jpg" alt="BaseWatch">
        <span class="tag">Community watch on the US military base in Darwin</span>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="menu">Menu</button>
    </div>
  </header>

  <div class="menubar">
    <div class="wrap">
      <nav class="menu" id="menu" aria-label="Site navigation"><div class="loading">Loading…</div></nav>
    </div>
  </div>

  <main id="content" tabindex="-1"><div class="wrap"><div class="loading">Loading…</div></div></main>

  <footer class="site">
    <div class="wrap foot-in">
      <strong>BaseWatch</strong> — a community response to the US military presence in Darwin.
      Contact <a href="mailto:contact@basewatch.org">contact@basewatch.org</a>.
      <span style="opacity:.7">Archived site; content preserved from the original.</span>
    </div>
  </footer>

<script>
  var esc = function (s) { return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  var api = function (p) { return fetch('/api' + p).then(function (r) { return r.json(); }); };
  var menuEl = document.getElementById('menu');
  var content = document.getElementById('content');
  var toggle = document.getElementById('menuToggle');
  var SITE = null;

  function pageFromPath() {
    var p = location.pathname.replace(/^\/+|\/+$/g, '');
    return (p === '' || p === 'index.html') ? (SITE ? SITE.home : 'front') : p;
  }
  function hrefFor(link) { return (SITE && link === SITE.home) ? '/' : '/' + link; }

  function go(path) {
    history.pushState({}, '', path);
    render();
    if (window.innerWidth <= 820) closeMenu();
    content.focus(); window.scrollTo(0, 0);
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a');
    if (!a) return;
    var href = a.getAttribute('href');
    if (!href || a.target === '_blank' || /^(https?:|mailto:|tel:)/.test(href) || href[0] !== '/') return;
    e.preventDefault(); go(href);
  });
  window.addEventListener('popstate', render);

  function openMenu() { menuEl.hidden = false; toggle.setAttribute('aria-expanded', 'true'); }
  function closeMenu() { menuEl.hidden = true; toggle.setAttribute('aria-expanded', 'false'); }
  toggle.onclick = function () { (toggle.getAttribute('aria-expanded') === 'true') ? closeMenu() : openMenu(); };

  function buildNav(menu, current) {
    var byParent = {};
    menu.forEach(function (m) { (byParent[m.parent] = byParent[m.parent] || []).push(m); });
    Object.keys(byParent).forEach(function (k) { byParent[k].sort(function (a, b) { return a.ordinal - b.ordinal; }); });
    function branch(parent, depth) {
      var kids = byParent[parent] || [];
      if (!kids.length) return '';
      return '<ul>' + kids.map(function (k) {
        var hasKids = (byParent[k.item] || []).length > 0;
        var cur = k.link === current ? ' aria-current="page"' : '';
        var pop = hasKids ? ' aria-haspopup="true"' : '';
        var caret = hasKids ? '<span class="caret" aria-hidden="true">' + (depth === 0 ? '▾' : '▸') + '</span>' : '';
        return '<li><a href="' + esc(hrefFor(k.link)) + '"' + cur + pop + '>' + esc(k.title) + caret + '</a>' + branch(k.item, depth + 1) + '</li>';
      }).join('') + '</ul>';
    }
    return branch('', 0);
  }

  function renderPage(name) {
    content.innerHTML = '<div class="wrap"><div class="loading">Loading…</div></div>';
    api('/page/' + encodeURIComponent(name)).then(function (d) {
      if (!d || !d.page) {
        content.innerHTML = '<div class="wrap page"><h1>Not found</h1><p class="body">That page doesn’t exist. <a href="/">Return home</a>.</p></div>';
        document.title = 'Not found — BaseWatch'; return;
      }
      var pg = d.page;
      content.innerHTML = '<div class="wrap page"><h1>' + esc(pg.title) + '</h1><div class="body">' + pg.body + '</div></div>';
      document.title = pg.title + ' — BaseWatch';
    });
  }

  function render() {
    if (!SITE) return;
    var name = pageFromPath();
    menuEl.innerHTML = buildNav(SITE.menu, name);
    renderPage(name);
  }

  if (window.innerWidth <= 820) menuEl.hidden = true;
  api('/site').then(function (d) { SITE = d; render(); });
</script>
</body>
</html>
