name = "articles"
main = "worker-entry.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Local development
[dev]
port = 8787
local_protocol = "http"

# D1 Database binding (default = justat, the first tenant)
[[d1_databases]]
binding = "DB"
database_name = "justat-db"
database_id = "95b46981-c09e-4f80-89a5-3574c81c83ad"

# Durable Objects
[durable_objects]
bindings = [
    { name = "EVENTS", class_name = "EventHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventHub"]

# R2 blob storage
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "justat-blobs"

# Static assets
[assets]
directory = "./_site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

# ADMIN_KEY is deliberately absent from [vars]: a plain-text var here would
# override a same-named dashboard secret on deploy. Local dev reads it from
# .dev.vars; every deployed tenant from its own `wrangler secret put ADMIN_KEY`.
[vars]
ENVIRONMENT = "production"

# ============================================================
# Tenants (one articles app, many sites). Deploy with --env <name>.
# Bindings are NOT inherited by environments, so each block repeats them.
# ============================================================

# -- justat.at (worker "justat") — cut over to Cloudflare 2026-09-08 --
[env.justat]
name = "justat"
routes = [
    { pattern = "justat.at", custom_domain = true },
    { pattern = "www.justat.at", custom_domain = true }
]

[env.justat.vars]
ENVIRONMENT = "production"

[[env.justat.d1_databases]]
binding = "DB"
database_name = "justat-db"
database_id = "95b46981-c09e-4f80-89a5-3574c81c83ad"

[[env.justat.r2_buckets]]
binding = "BLOBS"
bucket_name = "justat-blobs"

[env.justat.durable_objects]
bindings = [
    { name = "EVENTS", class_name = "EventHub" }
]

[env.justat.assets]
directory = "./_site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

# -- nowdochemtrails.net (worker "ndct") — no custom domain yet, inspect via workers.dev --
[env.ndct]
name = "ndct"

[env.ndct.vars]
ENVIRONMENT = "production"

[[env.ndct.d1_databases]]
binding = "DB"
database_name = "ndct-db"
database_id = "6995e8ca-652a-4686-af23-c06e93af42f3"

[[env.ndct.r2_buckets]]
binding = "BLOBS"
bucket_name = "ndct-blobs"

[env.ndct.durable_objects]
bindings = [
    { name = "EVENTS", class_name = "EventHub" }
]

[env.ndct.assets]
directory = "./_site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
